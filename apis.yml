  that extends revolving credit (via partner WebBank) to underserved consumers so they can purchase
  brand-name merchandise across home, electronics, apparel, and general merchandise categories. Bluestem
  historically operated a broader portfolio of catalog and e-commerce brands and reaches shoppers through
